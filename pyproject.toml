[project]
name = "cad-tui"
version = "0.1.0"
description = "A calcurse-inspired terminal task manager and calendar, styled with a Material-tonal / Apple-HIG color system."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SuriyaRajan", email = "suriyarajan12@gmail.com" }]
keywords = [
    "tui",
    "terminal",
    "cli",
    "calendar",
    "task-manager",
    "todo",
    "productivity",
    "textual",
    "calcurse",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Utilities",
]
dependencies = [
    "textual>=8.0",
]

[project.urls]
Homepage = "https://github.com/AyirusZone/cad_tui"
Repository = "https://github.com/AyirusZone/cad_tui"
Issues = "https://github.com/AyirusZone/cad_tui/issues"

[project.scripts]
cad-tui = "cad_tui.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-textual-snapshot>=1.0",
    "build>=1.2",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cad_tui = ["presentation/styles/*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
