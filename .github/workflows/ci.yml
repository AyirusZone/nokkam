name: CI

on:
  pull_request:
  push:
    branches: [development, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, type-check, test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project with dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests

      - name: Black format check
        run: black --check src tests

      - name: Mypy type check
        run: mypy src

      - name: Pytest with coverage
        run: |
          pytest --cov=cad_tui --cov-report=xml --cov-report=html

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/

  validate-package:
    name: Build and validate package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project with dev dependencies
        run: pip install -e ".[dev]"

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify pyproject.toml is well-formed
        run: python -c "import tomllib; tomllib.load(open('pyproject.toml', 'rb'))"

      - name: twine check (validates package metadata)
        run: twine check --strict dist/*

      - name: Verify README renders correctly (as PyPI would render it)
        run: python -m readme_renderer README.md -o /tmp/README.rendered.html

      - name: Verify LICENSE exists
        run: test -f LICENSE

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
