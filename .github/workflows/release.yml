name: Release (build, validate, test)

on:
  workflow_call:
    inputs:
      tag_prefix:
        description: 'Prefix stripped from the tag before comparing to pyproject.toml (e.g. "v" or "dev-v")'
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-build-test:
    name: Validate, build, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project with dev dependencies
        run: pip install -e ".[dev]"

      - name: Validate tag matches pyproject.toml version
        env:
          TAG_NAME: ${{ github.ref_name }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
        run: |
          set -euo pipefail
          if [[ "$TAG_NAME" != "$TAG_PREFIX"* ]]; then
            echo "::error::Tag '$TAG_NAME' does not start with expected prefix '$TAG_PREFIX'"
            exit 1
          fi
          TAG_VERSION="${TAG_NAME#"$TAG_PREFIX"}"
          PYPROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          # A dev release's tag (e.g. dev-v0.5.0) is compared against the
          # release segment of a PEP 440 dev version (0.5.0.dev1 -> 0.5.0).
          PYPROJECT_BASE_VERSION="${PYPROJECT_VERSION%%.dev*}"
          echo "Tag version:       $TAG_VERSION"
          echo "pyproject.toml:    $PYPROJECT_VERSION (base: $PYPROJECT_BASE_VERSION)"
          if [ "$TAG_VERSION" != "$PYPROJECT_BASE_VERSION" ]; then
            echo "::error::Tag version '$TAG_VERSION' does not match pyproject.toml version '$PYPROJECT_VERSION'"
            exit 1
          fi

      - name: Ruff lint
        run: ruff check src tests

      - name: Black format check
        run: black --check src tests

      - name: Mypy type check
        run: mypy src

      - name: Pytest with coverage
        run: pytest --cov=cad_tui --cov-report=xml --cov-report=html

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify pyproject.toml is well-formed
        run: python -c "import tomllib; tomllib.load(open('pyproject.toml', 'rb'))"

      - name: twine check (validates package metadata)
        run: twine check --strict dist/*

      - name: Verify README renders correctly (as PyPI would render it)
        run: python -m readme_renderer README.md -o /tmp/README.rendered.html

      - name: Verify LICENSE exists
        run: test -f LICENSE

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
